opal:
  testing-support-endpoints:
    enabled: false
  file-handling-service:
    file-types:
      bteckoh-report:
        container-name: ${BTECKOH_REPORT_AZURE_STORAGE_CONTAINER:bteckoh-report}
      caps-report:
        container-name: ${CAPS_REPORT_AZURE_STORAGE_CONTAINER:caps-report}
      bailiffs:
       cder:
         container-name: ${CDER_AZURE_STORAGE_CONTAINER:cder}
         feature-flag: bailiffs.cder-file-transfer-Job
         file-name-regex: \d{10}_dat_\d{10}_\d{8}_\d{6}.txt
         source: CDER
         target: OPAL
         sftp-username: ${BAIS_SFTP_CDER_USERNAME:CDER}
user:
  service:
    url: http://localhost:4553