services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 2s
      timeout: 3s
      retries: 30
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["127.0.0.1::10000"]
  sftp:
    image: atmoz/sftp:alpine
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /etc/sftp.d /home/CAPS-report/.ssh/keys /home/BTEckoh-report/.ssh/keys
        cp /test-key.pub /home/CAPS-report/.ssh/keys/test.pub
        cp /test-key.pub /home/BTEckoh-report/.ssh/keys/test.pub
        cp /test-configure-sftp /etc/sftp.d/configure-sftp
        chmod +x /etc/sftp.d/configure-sftp
        exec /entrypoint "$$@"
      - --
    command: ["CAPS-report::1001", "BTEckoh-report::1002", "AllPay::1003"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1::22"]
    volumes:
      - ./src/integrationTest/resources/bais-emulator/configure-sftp:/test-configure-sftp:ro
      - ./src/integrationTest/resources/bais-emulator/keys/bais-sftp-key.pub:/test-key.pub:ro
