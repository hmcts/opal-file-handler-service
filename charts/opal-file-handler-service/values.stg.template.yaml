java:
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  keyVaults:
    opal:
      secrets:
        - name: bais-private-key
          alias: BAIS_SFTP_PRIVATE_KEY
        - name: bais-sftp-connection-host
          alias: BAIS_SFTP_CONNECTION_HOST
        - name: bais-sftp-connection-port
          alias: BAIS_SFTP_CONNECTION_PORT
        - name: bais-sftp-caps-report-username
          alias: BAIS_SFTP_CAPS_REPORT_USERNAME
        - name: bais-sftp-bteckoh-report-username
          alias: BAIS_SFTP_BTECKOH_REPORT_USERNAME
  environment:
    OPAL_USER_SERVICE_API_URL: https://opal-user-service.staging.platform.hmcts.net
    TESTING_SUPPORT_ENDPOINTS_ENABLED: true
    LAUNCH_DARKLY_ENABLED: false
    RELEASE_1C_BANKING_INTERFACES_ENABLED: true
    CAPS_REPORT_FILE_TRANSFER_JOB_ENABLED: true
    BTECKOH_REPORT_FILE_TRANSFER_JOB_ENABLED: true
    FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/stg

functionalTest:
  blob:
    containerName: bteckoh-report

bt-eckoh-report:
  releaseNameOverride: opal-file-handler-service-stg-bt-eckoh-report
  image: ${IMAGE_NAME}
  environment:
    OPAL_FRONTEND_URL: https://opal-frontend-staging.staging.apps.hmcts.net
    TESTING_SUPPORT_ENDPOINTS_ENABLED: false
    FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/stg

